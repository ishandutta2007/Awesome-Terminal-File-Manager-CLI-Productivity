<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.25; }
      100% { transform: translateY(400px); opacity: 0; }
    }
    .orb1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .pill1 { animation: floatPill 5s ease-in-out infinite; }
    .pill2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .cursor { animation: blinkCursor 1s infinite; }
    .scanline { animation: scanLine 6s linear infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .code-term {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 14px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Deep Background -->
  <g filter="url(#softGlow)">
    <circle class="orb1" cx="220" cy="120" r="160" fill="#38bdf8" />
    <circle class="orb2" cx="980" cy="280" r="180" fill="#818cf8" />
    <circle class="orb1" cx="600" cy="380" r="120" fill="#c084fc" opacity="0.3" />
  </g>

  <!-- High-tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Subtle Scanline Effect -->
  <rect class="scanline" width="1200" height="8" fill="url(#primaryGlow)" />

  <!-- Terminal Header / Mockup Box in Foreground (Clear, readable layout) -->
  <g transform="translate(100, 45)">
    <!-- Terminal Shell Background -->
    <rect width="1000" height="310" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Window Chrome Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#1e293b" stroke-width="1.5" />

    <!-- Terminal Prompt Line -->
    <text x="100" y="28" class="code-term" opacity="0.8">~/terminal-productivity  ⚡  awesome-cli</text>

    <!-- Main Title in Foreground -->
    <text x="50" y="115" class="title-text">
      Awesome Terminal File Managers
    </text>
    <text x="50" y="152" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28px" letter-spacing="2px">
      &amp; MODERN CLI PRODUCTIVITY ECOSYSTEM
    </text>

    <!-- Subtitle in Foreground -->
    <text x="50" y="196" class="subtitle-text">
      Curated index of blazingly fast TUI navigators, dual-pane orthodox commanders,
    </text>
    <text x="50" y="224" class="subtitle-text">
      cloud storage transfer engines, and keyboard-centric CLI utilities.
    </text>

    <!-- Foreground Floating Badges / Filter Pills with subtle independent dynamic float -->
    <g class="pill1" transform="translate(50, 248)">
      <rect width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="80" y="20" class="badge-text" text-anchor="middle">⚡ Yazi &amp; Superfile</text>
    </g>

    <g class="pill2" transform="translate(225, 248)">
      <rect width="175" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="87" y="20" class="badge-text" text-anchor="middle">📁 Dual-Pane TUI / GUI</text>
    </g>

    <g class="pill3" transform="translate(415, 248)">
      <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="75" y="20" class="badge-text" text-anchor="middle">☁️ Rclone &amp; Cloud</text>
    </g>

    <g class="pill1" transform="translate(580, 248)">
      <rect width="165" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="82" y="20" class="badge-text" text-anchor="middle">🔍 fzf • fd • ripgrep</text>
    </g>

    <!-- Prompt Cursor in Foreground -->
    <g transform="translate(760, 253)">
      <rect width="80" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="12" y="15" font-family="monospace" font-size="12px" fill="#38bdf8">$ tree</text>
      <rect class="cursor" x="58" y="5" width="7" height="12" fill="#38bdf8" />
    </g>
  </g>
</svg>
